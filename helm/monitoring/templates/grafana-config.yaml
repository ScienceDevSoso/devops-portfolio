apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 60s
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: Portfolio
        folder: Portfolio
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /etc/grafana/dashboards
  overview.json: |
    {{- .Files.Get "files/overview.json" | nindent 4 }}
