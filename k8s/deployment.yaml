apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-portfolio

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devops-portfolio

  template:
    metadata:
      labels:
        app: devops-portfolio

    spec:
      containers:
        - name: devops-portfolio
          image: ghcr.io/sciencedevsoso/devops-portfolio:latest
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
