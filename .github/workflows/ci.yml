name: FastAPI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  monitoring-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install validation tools
        run: |
          python3 -m pip install PyYAML==6.0.3
          curl -fsSL https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz -o /tmp/prometheus.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp prometheus-3.14.0.linux-amd64/promtool

      - name: Validate charts, scrape config, and dashboard queries
        run: |
          /tmp/linux-amd64/helm lint helm/devops-portfolio helm/monitoring
          /tmp/linux-amd64/helm template devops-portfolio helm/devops-portfolio > /tmp/app.yaml
          /tmp/linux-amd64/helm template monitoring helm/monitoring -n monitoring > /tmp/monitoring.yaml
          python3 scripts/extract-monitoring-config.py /tmp/monitoring.yaml /tmp/monitoring-check
          /tmp/prometheus-3.14.0.linux-amd64/promtool check config --syntax-only /tmp/monitoring-check/prometheus.yml
          /tmp/prometheus-3.14.0.linux-amd64/promtool check rules /tmp/monitoring-check/dashboard-rules.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t devops-portfolio:ci .

  publish-image:
    needs: docker-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for registry
        run: |
          docker build \
            -t ghcr.io/sciencedevsoso/devops-portfolio:latest \
            -t ghcr.io/sciencedevsoso/devops-portfolio:${{ github.sha }} \
            .

      - name: Push image to registry
        run: |
          docker push ghcr.io/sciencedevsoso/devops-portfolio:latest
          docker push ghcr.io/sciencedevsoso/devops-portfolio:${{ github.sha }}
